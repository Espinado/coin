<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #04101c; -webkit-font-smoothing: antialiased; }
  a { color: oklch(0.86 0.11 195); text-decoration: none; }
  a:hover { color: oklch(0.92 0.09 195); }
  input::placeholder { color: rgba(230,244,250,0.42); }
  input:focus { outline: none; }
</style>
</helmet>

<div style="width: 1440px; min-height: 900px; margin: 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 80px 72px; box-sizing: border-box; background: #061423; color: #e6f4fa; font-family: 'Sora', 'Helvetica Neue', Helvetica, sans-serif; overflow: hidden;">
  <div style="position: absolute; top: -300px; left: 50%; width: 900px; height: 680px; margin-left: -450px; border-radius: 50%; background: radial-gradient(closest-side, oklch(0.62 0.13 198 / 0.22), transparent 74%); filter: blur(30px); pointer-events: none;"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 11px;">
    <div style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, oklch(0.86 0.12 192), oklch(0.6 0.13 210)); display: grid; place-items: center;">
      <div style="width: 11px; height: 11px; border-radius: 3px; background: #061423;"></div>
    </div>
    <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">Project AI</span>
  </div>

  <div style="position: relative; width: 420px; padding: 36px 36px 30px; border-radius: 22px; border: 1px solid rgba(150,235,250,0.16); background: linear-gradient(170deg, rgba(13,38,58,0.92), rgba(5,16,27,0.96)); box-shadow: 0 50px 110px -50px #000;">
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.025em; color: #f0fbff;">Sign in to your account</div>

    <div style="margin-top: 26px;">
      <label style="display: block; font-size: 12.5px; color: rgba(230,244,250,0.78);">Email</label>
      <input type="text" value="{{ email }}" onChange="{{ onEmail }}" placeholder="you@example.com" style="width: 100%; box-sizing: border-box; margin-top: 9px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(150,235,250,0.18); background: rgba(4,16,28,0.7); color: #f0fbff; font-family: inherit; font-size: 14.5px;" />
    </div>

    <div style="margin-top: 18px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px;">
        <label style="font-size: 12.5px; color: rgba(230,244,250,0.78);">Password</label>
        <a href="#" style="font-size: 12.5px;">Forgot password?</a>
      </div>
      <div style="position: relative; margin-top: 9px;">
        <input type="{{ passType }}" value="{{ password }}" onChange="{{ onPassword }}" placeholder="Enter password" style="width: 100%; box-sizing: border-box; padding: 14px 92px 14px 16px; border-radius: 12px; border: 1px solid rgba(150,235,250,0.18); background: rgba(4,16,28,0.7); color: #f0fbff; font-family: inherit; font-size: 14.5px;" />
        <button onClick="{{ togglePass }}" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(150,235,250,0.18); background: rgba(150,235,250,0.07); color: rgba(230,244,250,0.85); font-family: inherit; font-size: 12px; cursor: pointer;">{{ passToggleLabel }}</button>
      </div>
    </div>

    <button onClick="{{ toggleRemember }}" style="display: flex; align-items: center; gap: 10px; margin-top: 20px; padding: 0; border: 0; background: none; font-family: inherit; font-size: 13px; color: rgba(230,244,250,0.82); cursor: pointer;">
      <span style="position: relative; width: 18px; height: 18px; flex: none; border-radius: 6px; border: 1px solid rgba(150,235,250,0.26); background: rgba(4,16,28,0.7);">
        <sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; inset: 3px; border-radius: 3px; background: linear-gradient(140deg, oklch(0.86 0.12 192), oklch(0.66 0.13 205));"></span></sc-if>
      </span>
      Remember me
    </button>

    <button style="width: 100%; margin-top: 24px; padding: 15px; border-radius: 12px; border: 1px solid oklch(0.86 0.11 195 / 0.5); background: linear-gradient(140deg, oklch(0.86 0.12 192), oklch(0.66 0.13 205)); color: #04121f; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 20px 46px -22px oklch(0.8 0.13 195 / 0.85);">Sign in</button>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(150,235,250,0.1); text-align: center; font-size: 13px; color: rgba(230,244,250,0.72);">
      No account? <a href="#">Sign up</a>
    </div>
  </div>

  <div style="position: relative; display: flex; gap: 24px; font-size: 12.5px;">
    <a href="#" style="color: rgba(230,244,250,0.68);">Privacy policy</a>
    <a href="#" style="color: rgba(230,244,250,0.68);">Terms</a>
    <a href="#" style="color: rgba(230,244,250,0.68);">Support</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { email: '', password: '', visible: false, remember: true };

  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      passType: this.state.visible ? 'text' : 'password',
      passToggleLabel: this.state.visible ? 'Hide' : 'Show',
      remember: this.state.remember,
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      togglePass: () => this.setState((s) => ({ visible: !s.visible })),
      toggleRemember: () => this.setState((s) => ({ remember: !s.remember }))
    };
  }
}
</script>
</body>
</html>
